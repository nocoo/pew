name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  l1-pre-commit-selftest:
    name: "L1 Pre-commit Gate Self-test"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd  # v2026.10
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      timeout-minutes: 90
      pre-command: "bun run build"
      command: "bun run test:l1-gate"

  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd  # v2026.10
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      lint-command: "bun run lint"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "typecheck already executed as first step inside bun run lint"}'
      osv-config: "osv-scanner.toml"

  api-e2e:
    name: "L2 API E2E"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd  # v2026.10
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      timeout-minutes: 15
      pre-command: "bun run build"
      command: "bun run test:e2e"

  browser-e2e:
    name: "L3 Browser E2E"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd  # v2026.10
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      browser: "chromium"
      timeout-minutes: 20
      pre-command: "bun run build"
      command: "bun run test:e2e:ui"

  container-smoke:
    name: "Linux Image Native and Startup Smoke"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd  # v2026.10
    with:
      runtime: "none"
      node-version: "22.23.4"
      timeout-minutes: 25
      command: |
        docker build --platform linux/amd64 --tag pew-ci:${{ github.sha }} .
        node scripts/smoke-container.mjs pew-ci:${{ github.sha }}

  release-smoke:
    name: "Release Workflow Smoke"
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@633a5545fcfec91b688840650d4edf3e9cc1abbd  # v2026.10
    with:
      files: ".github/workflows/ci.yml .github/workflows/release.yml"
      required-reusable-workflow: "nocoo/base-ci/.github/workflows/deploy-docker.yml"
      yamllint: true
