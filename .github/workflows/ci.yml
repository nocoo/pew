name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      coverage-path: "coverage"
      prepare-command: "bun run build"
      lint-command: "bun run lint"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "typecheck already executed as first step inside bun run lint"}'
      osv-config: "osv-scanner.toml"

  api-e2e:
    name: "L2 API E2E"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      timeout-minutes: 15
      pre-command: "bun run build"
      command: "bun run test:e2e"

  browser-e2e:
    name: "L3 Browser E2E"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      browser: "chromium"
      timeout-minutes: 20
      pre-command: "bun run build"
      command: "bun run test:e2e:ui"
