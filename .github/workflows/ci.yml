name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      prepare-command: "bun run build"
      lint-command: "bun run lint"
      test-command: "bun run test:coverage"
      typecheck: false
      disabled-check-reasons: '{"typecheck": "typecheck already executed as first step inside bun run lint"}'
      osv-config: "osv-scanner.toml"
    secrets: inherit

  api-e2e:
    name: "L2 API E2E"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      timeout-minutes: 15
      pre-command: |
        bun run build
        cat > packages/web/.env.local << 'ENVEOF'
        CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
        CF_D1_DATABASE_ID=${CF_D1_DATABASE_ID}
        CF_D1_API_TOKEN=${CF_D1_API_TOKEN}
        WORKER_INGEST_URL=${WORKER_INGEST_URL}
        WORKER_READ_URL=${WORKER_READ_URL}
        WORKER_SECRET=${WORKER_SECRET}
        WORKER_READ_SECRET=${WORKER_READ_SECRET}
        AUTH_SECRET=${AUTH_SECRET}
        ENVEOF
        cat > packages/web/.env.test << 'ENVEOF'
        CF_D1_DATABASE_ID_TEST=${CF_D1_DATABASE_ID_TEST}
        WORKER_INGEST_URL_TEST=${WORKER_INGEST_URL_TEST}
        WORKER_READ_URL_TEST=${WORKER_READ_URL_TEST}
        ENVEOF
      command: "bun run test:e2e"
    secrets:
      test-env-json: ${{ toJson(secrets) }}

  browser-e2e:
    name: "L3 Browser E2E"
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.4.0"
      install-policy: "blocked"
      browser: "chromium"
      timeout-minutes: 20
      pre-command: |
        bun run build
        cat > packages/web/.env.local << 'ENVEOF'
        CF_ACCOUNT_ID=${CF_ACCOUNT_ID}
        CF_D1_DATABASE_ID=${CF_D1_DATABASE_ID}
        CF_D1_API_TOKEN=${CF_D1_API_TOKEN}
        WORKER_INGEST_URL=${WORKER_INGEST_URL}
        WORKER_READ_URL=${WORKER_READ_URL}
        WORKER_SECRET=${WORKER_SECRET}
        WORKER_READ_SECRET=${WORKER_READ_SECRET}
        AUTH_SECRET=${AUTH_SECRET}
        ENVEOF
        cat > packages/web/.env.test << 'ENVEOF'
        CF_D1_DATABASE_ID_TEST=${CF_D1_DATABASE_ID_TEST}
        WORKER_INGEST_URL_TEST=${WORKER_INGEST_URL_TEST}
        WORKER_READ_URL_TEST=${WORKER_READ_URL_TEST}
        ENVEOF
      command: "bun run test:e2e:ui"
    secrets:
      test-env-json: ${{ toJson(secrets) }}
