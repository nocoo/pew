name: Release
'on':
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      ci-run-id:
        description: Successful main push CI run ID for the exact tested commit
        required: true
        type: string
jobs:
  deploy:
    if: |
      github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    uses: nocoo/base-ci/.github/workflows/deploy-docker.yml@af9a2b3f82c367d6eb6def5c3583ac717e0868ad  # main 2026-10-26
    with:
      tailscale: true
      environment: pew / production
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.ci-run-id }}
      images: '[{"image":"ghcr.io/nocoo/pew","service":"web"}]'
      deploy-directory: /opt/pew
      remote-verify-command: |
        python3 - <<'PY'
        import json, os, re, subprocess, time, urllib.error, urllib.request

        def verify():
            source = os.environ['IMAGE_SHA']
            releases = json.loads(os.environ['RELEASE_IMAGES'])
            if not re.fullmatch(r'[a-f0-9]{40}', source) or not isinstance(releases, list) or len(releases) != 1:
                raise SystemExit('Invalid Pew release manifest')
            release = releases[0]
            if (not isinstance(release, dict) or release.get('service') != 'web'
                    or release.get('image') != 'ghcr.io/nocoo/pew' or release.get('sourceSha') != source
                    or not re.fullmatch(r'sha256:[a-f0-9]{64}', release.get('digest', ''))):
                raise SystemExit('Release manifest does not identify the expected Pew image')

            reference = release['image'] + '@' + release['digest']
            image = json.loads(subprocess.check_output(['docker', 'image', 'inspect', reference], text=True))[0]
            container = json.loads(subprocess.check_output(['docker', 'inspect', 'pew-app'], text=True))[0]
            runtime_names = [entry.partition('=')[0] for entry in container['Config'].get('Env', [])]
            if any(name.startswith('E2E_') or name == 'NODE_OPTIONS' for name in runtime_names):
                raise SystemExit('Forbidden runtime environment setting detected')
            labels = image.get('Config', {}).get('Labels', {})
            if (container['Config']['Image'] != reference or container['Image'] != image['Id']
                    or not container.get('State', {}).get('Running')
                    or reference not in image.get('RepoDigests', [])
                    or labels.get('org.opencontainers.image.revision') != source
                    or labels.get('org.opencontainers.image.source') != 'https://github.com/nocoo/pew'):
                raise SystemExit('Running container does not match the verified image digest and source labels')
            version = subprocess.check_output(
                ['docker', 'exec', 'pew-app', 'node', '-p', "JSON.parse(require('fs').readFileSync('/app/packages/web/package.json')).version"],
                text=True).strip()
            if not re.fullmatch(r'\d+\.\d+\.\d+', version):
                raise SystemExit('Running image package version is invalid')

            class NoRedirect(urllib.request.HTTPRedirectHandler):
                def redirect_request(self, req, fp, code, msg, headers, newurl):
                    return None

            opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), NoRedirect())

            def request(path, method='GET', body=None):
                headers = {'Host': 'pew.md', 'X-Forwarded-Proto': 'https'}
                req = urllib.request.Request('http://127.0.0.1:17020' + path, data=body, headers=headers, method=method)
                try:
                    response = opener.open(req, timeout=10)
                    return response.status, response.headers, response.read()
                except urllib.error.HTTPError as error:
                    return error.code, error.headers, error.read()

            live = None
            for attempt in range(10):
                try:
                    status, headers, payload = request('/api/live')
                    candidate = json.loads(payload)
                    if (status == 200 and headers.get('Cache-Control') == 'no-store'
                            and candidate.get('status') == 'ok' and candidate.get('component') == 'dashboard'
                            and candidate.get('database') == {'connected': True} and candidate.get('version') == version):
                        live = candidate
                        break
                except Exception:
                    pass
                if attempt < 9:
                    time.sleep(3)
            if not live:
                raise SystemExit('Private /api/live did not confirm image version and D1 health')

            for path in ['/', '/login', '/privacy']:
                status, headers, body = request(path)
                if status != 200 or 'text/html' not in headers.get('Content-Type', '') or not body:
                    raise SystemExit('Private read-only public page check failed')
            status, headers, body = request('/logo-80.png')
            if status != 200 or 'image/png' not in headers.get('Content-Type', '') or not body:
                raise SystemExit('Private static asset check failed')
            status, _, body = request('/api/leaderboard?limit=1')
            leaderboard = json.loads(body)
            if status != 200 or not isinstance(leaderboard.get('entries'), list) or leaderboard.get('scope') != 'global':
                raise SystemExit('Private read-only leaderboard check failed')
            if request('/api/devices')[0] != 401:
                raise SystemExit('Private unauthenticated read denial check failed')
            for path in ['/api/ingest', '/api/ingest/sessions', '/api/ingest/evidence', '/api/ingest/details']:
                if request(path, 'POST', b'')[0] != 401:
                    raise SystemExit('Private unauthenticated ingest denial check failed')
            print(f"Private Pew acceptance passed: revision {source}, {release['digest']}, version {live['version']}")

        try:
            verify()
        except Exception:
            raise SystemExit('Private Pew acceptance failed') from None
        PY
      verify-command: |
        node --input-type=module <<'JS'
        import { verifyDeployment } from './scripts/verify-deployment.mjs';
        try {
          console.log(await verifyDeployment({
            phase: ${{ toJSON(vars.DEPLOY_PHASE) }},
            target: ${{ toJSON(vars.DEPLOY_URL) }},
            originMarker: ${{ toJSON(vars.DEPLOY_ORIGIN_MARKER) }},
            sourceSha: process.env.SOURCE_SHA,
            imageManifest: process.env.RELEASE_IMAGES,
          }));
        } catch (error) {
          console.error(`Deployment verification failed: ${error.message}`);
          process.exitCode = 1;
        }
        JS
      timeout-minutes: 25
    secrets:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      GHCR_PULL_USER: ${{ secrets.GHCR_PULL_USER }}
      GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
permissions:
  contents: read
  actions: read
  packages: write
  id-token: write
